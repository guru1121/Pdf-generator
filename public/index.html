<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Generate PDF</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; }
    label { display:block; margin-top:10px }
    input, select, textarea { width:100%; padding:8px; box-sizing:border-box }
    button { margin-top: 16px; padding: 10px 16px }
  </style>
</head>
<body>
  <h1>Invoice Generator</h1>
  <form id="pdfForm">
    <fieldset>
      <legend>Seller (Your Company)</legend>
      <label>Company Name<input name="seller_name" required value="INDO DICTIONARY NETWORKS PRIVATE LIMITED"></label>
      <label>Address Line 1<input name="seller_address1" value="12/1, Nandbagh Sector D, Army Head Quarter, Indore,"></label>
      <label>Address Line 2<input name="seller_address2" value="Indore, Madhya Pradesh, India - 452006"></label>
      <label>City<input name="seller_city" value="Indore"></label>
      <label>GSTIN<input name="seller_gstin" value="23AAICI1972L1ZC"></label>
      <label>Contact<input name="seller_contact" value="info@dictionarynetworks.in, +91-96636 81258"></label>
    </fieldset>

    <fieldset>
      <legend>Buyer</legend>
      <label>Buyer Name<input name="buyer_name"></label>
      <label>Address Line 1<input name="buyer_address1"></label>
      <label>Address Line 2<input name="buyer_address2"></label>
      <label>City<input name="buyer_city"></label>
      <label>GSTIN<input name="buyer_gstin"></label>
    </fieldset>

    <fieldset>
      <legend>Invoice Details</legend>
      <label>Invoice Number<input name="invoice_number"></label>
      <label>Invoice Date<input name="invoice_date" type="date"></label>
      <label>Ref. PO Number<input name="ref_po"></label>
      <label>Ref. PI Number<input name="ref_pi"></label>
      <label>Place of Supply<input name="place_of_supply"></label>
      <label>GST Rate (%)<input name="gst_rate" value="18" type="number"></label>
    </fieldset>

    <fieldset>
      <legend>Items</legend>
      <table id="itemsTable">
        <thead>
          <tr><th>#</th><th>Description</th><th>Quantity</th><th>Unit Price</th><th></th></tr>
        </thead>
        <tbody>
          <tr>
            <td class="idx">1</td>
            <td><input name="item_description" class="desc"></td>
            <td><input name="item_quantity" class="qty" type="number" value="1"></td>
            <td><input name="item_unitPrice" class="price" type="number" step="0.01" value="0"></td>
            <td><button type="button" class="removeRow">Remove</button></td>
          </tr>
        </tbody>
      </table>
      <button type="button" id="addItem">Add Item</button>
    </fieldset>

    <fieldset>
      <legend>Payment</legend>
      <label>Payment Method<input name="payment_method"></label>
      <label>Payment Date<input name="payment_date" type="date"></label>
    </fieldset>

    <button type="submit">Preview PDF</button>
  </form>

  <div id="status"></div>

  <!-- PDF Preview Modal -->
  <div id="previewModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; padding:20px; box-sizing:border-box">
    <div style="background:white; height:100%; display:flex; flex-direction:column; border-radius:8px">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid #ddd">
        <h3 style="margin:0">PDF Preview</h3>
        <button id="closeTopPreview" type="button" style="padding:8px 12px">Close</button>
      </div>
      <div style="flex:1; overflow:auto">
        <iframe id="pdfPreview" style="width:100%; height:100%; border:none" src=""></iframe>
      </div>
      <div style="display:flex; gap:12px; padding:12px; border-top:1px solid #ddd">
        <button id="downloadFromPreview" type="button" style="padding:10px 16px; background:#28a745; color:white; border:none; border-radius:4px; cursor:pointer">Download PDF</button>
        <button id="closePreviewBtn" type="button" style="padding:10px 16px; background:#6c757d; color:white; border:none; border-radius:4px; cursor:pointer">Close</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('pdfForm');
    const status = document.getElementById('status');
    const previewModal = document.getElementById('previewModal');
    const pdfPreview = document.getElementById('pdfPreview');
    let currentPdfUrl = '';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'Generating PDF...';

        const fd = new FormData(form);

        // collect items
        const rows = Array.from(document.querySelectorAll('#itemsTable tbody tr'));
        const items = rows.map(r => ({
          description: r.querySelector('.desc').value,
          quantity: Number(r.querySelector('.qty').value) || 0,
          unitPrice: Number(r.querySelector('.price').value) || 0
        }));

        const data = {
          seller: {
            name: fd.get('seller_name'),
            addressLine1: fd.get('seller_address1'),
            addressLine2: fd.get('seller_address2'),
            city: fd.get('seller_city'),
            gstin: fd.get('seller_gstin'),
            contact: fd.get('seller_contact')
          },
          buyer: {
            name: fd.get('buyer_name'),
            addressLine1: fd.get('buyer_address1'),
            addressLine2: fd.get('buyer_address2'),
            city: fd.get('buyer_city'),
            gstin: fd.get('buyer_gstin')
          },
          invoiceNumber: fd.get('invoice_number'),
          invoiceDate: fd.get('invoice_date'),
          refPo: fd.get('ref_po'),
          refPi: fd.get('ref_pi'),
          placeOfSupply: fd.get('place_of_supply'),
          gstRate: Number(fd.get('gst_rate')) || 18,
          items,
          paymentMethod: fd.get('payment_method'),
          paymentDate: fd.get('payment_date'),
          timestamp: new Date().toLocaleString()
        };

      try {
        const res = await fetch('/genpdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Generation failed');

        status.textContent = 'PDF ready — showing preview...';
        currentPdfUrl = json.url;
        
        // Open preview modal with the PDF
        pdfPreview.src = currentPdfUrl;
        previewModal.style.display = 'flex';
      } catch (err) {
        console.error(err);
        status.textContent = 'Error: ' + (err.message || err);
      }
    });

    // Close preview modal
    document.getElementById('closeTopPreview').addEventListener('click', () => {
      previewModal.style.display = 'none';
      pdfPreview.src = '';
    });

    document.getElementById('closePreviewBtn').addEventListener('click', () => {
      previewModal.style.display = 'none';
      pdfPreview.src = '';
    });

    // Download from preview
    document.getElementById('downloadFromPreview').addEventListener('click', async () => {
      if (!currentPdfUrl) return;
      const r = await fetch(currentPdfUrl);
      const blob = await r.blob();
      const a = document.createElement('a');
      const blobUrl = URL.createObjectURL(blob);
      a.href = blobUrl;
      a.download = currentPdfUrl.split('/').pop();
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(blobUrl);
      status.textContent = 'Download started';
    });

    // dynamic items
    document.getElementById('addItem').addEventListener('click', () => {
      const tbody = document.querySelector('#itemsTable tbody');
      const idx = tbody.querySelectorAll('tr').length + 1;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="idx">${idx}</td>
        <td><input name="item_description" class="desc"></td>
        <td><input name="item_quantity" class="qty" type="number" value="1"></td>
        <td><input name="item_unitPrice" class="price" type="number" step="0.01" value="0"></td>
        <td><button type="button" class="removeRow">Remove</button></td>`;
      tbody.appendChild(tr);
    });

    document.querySelector('#itemsTable').addEventListener('click', (e) => {
      if (e.target.classList.contains('removeRow')) {
        const tr = e.target.closest('tr');
        tr.remove();
        // reindex
        Array.from(document.querySelectorAll('#itemsTable tbody tr')).forEach((r,i)=> r.querySelector('.idx').textContent = i+1);
      }
    });
  </script>
</body>
</html>
